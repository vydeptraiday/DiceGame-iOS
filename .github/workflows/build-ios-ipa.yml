name: Build iOS Unsigned IPA (iOS 16.2)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-unsigned-ipa:
    name: Compile Capacitor iOS 16.2 & Package IPA
    runs-on: macos-14

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Install Dependencies
        run: npm install --no-audit --no-fund

      - name: 4. Verify Web Assets Integrity
        run: node scripts/check-web.mjs

      - name: 5. Create & Sync Capacitor iOS Project
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: 6. Configure Fullscreen Landscape & Hide iPhone White Home Bar
        run: |
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationLandscapeRight" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:1 string UIInterfaceOrientationLandscapeLeft" "$PLIST"

          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:0 string UIInterfaceOrientationLandscapeRight" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations~ipad:1 string UIInterfaceOrientationLandscapeLeft" "$PLIST"

          /usr/libexec/PlistBuddy -c "Delete :UIStatusBarHidden" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :UIStatusBarHidden bool true" "$PLIST"

          /usr/libexec/PlistBuddy -c "Delete :UIViewControllerBasedStatusBarAppearance" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :UIViewControllerBasedStatusBarAppearance bool false" "$PLIST"

          /usr/libexec/PlistBuddy -c "Delete :UIRequiresFullScreen" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :UIRequiresFullScreen bool true" "$PLIST"

          cat << 'EOF' > ios/App/App/AppDelegate.swift
          import UIKit
          import Capacitor

          extension UIViewController {
              @objc func sunwin_prefersHomeIndicatorAutoHidden() -> Bool {
                  return true
              }
              @objc func sunwin_prefersStatusBarHidden() -> Bool {
                  return true
              }
          }

          @UIApplicationMain
          class AppDelegate: UIResponder, UIApplicationDelegate {

              var window: UIWindow?

              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  if let m1 = class_getInstanceMethod(UIViewController.self, #selector(getter: UIViewController.prefersHomeIndicatorAutoHidden)),
                     let s1 = class_getInstanceMethod(UIViewController.self, #selector(UIViewController.sunwin_prefersHomeIndicatorAutoHidden)) {
                      method_exchangeImplementations(m1, s1)
                  }
                  if let m2 = class_getInstanceMethod(UIViewController.self, #selector(getter: UIViewController.prefersStatusBarHidden)),
                     let s2 = class_getInstanceMethod(UIViewController.self, #selector(UIViewController.sunwin_prefersStatusBarHidden)) {
                      method_exchangeImplementations(m2, s2)
                  }
                  UIScrollView.appearance().contentInsetAdjustmentBehavior = .never
                  return true
              }

              func application(_ application: UIApplication, supportedInterfaceOrientationsFor window: UIWindow?) -> UIInterfaceOrientationMask {
                  return .landscape
              }

              func application(_ app: UIApplication, open url: URL, options: [UIApplication.OpenURLOptionsKey: Any] = [:]) -> Bool {
                  return ApplicationDelegateProxy.shared.application(app, open: url, options: options)
              }

              func application(_ application: UIApplication, continue userActivity: NSUserActivity, restorationHandler: @escaping ([UIUserActivityRestoring]?) -> Void) -> Bool {
                  return ApplicationDelegateProxy.shared.application(application, continue: userActivity, restorationHandler: restorationHandler)
              }
          }
          EOF

      - name: 7. Compile iOS 16.2 App (Unsigned Build)
        run: |
          cd ios/App
          if [ -d "App.xcworkspace" ]; then
            xcodebuild build \
              -workspace App.xcworkspace \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath "$RUNNER_TEMP/derived" \
              IPHONEOS_DEPLOYMENT_TARGET=16.2 \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              EXPANDED_CODE_SIGN_IDENTITY=""
          else
            xcodebuild build \
              -project App.xcodeproj \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath "$RUNNER_TEMP/derived" \
              IPHONEOS_DEPLOYMENT_TARGET=16.2 \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              EXPANDED_CODE_SIGN_IDENTITY=""
          fi

      - name: 8. Package Payload into .ipa
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/derived" -name "App.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "App.app not found!"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/App.app"
          cd "$RUNNER_TEMP/ipa"
          zip -qr "$GITHUB_WORKSPACE/HoangGiaVIP-iOS16.2-unsigned.ipa" Payload

      - name: 9. Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HoangGiaVIP-iOS16.2-IPA
          path: HoangGiaVIP-iOS16.2-unsigned.ipa
          retention-days: 90
